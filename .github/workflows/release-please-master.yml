name: release-please (master hotfixes)

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'juliansteenbakker/flutter_ble_peripheral'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: master

  # After a hotfix release lands on master, open a PR to bring the fix and the
  # version/changelog bump back into develop. This is left for manual merging,
  # since CHANGELOG.md/pubspec.yaml can genuinely conflict with unreleased
  # changes already on develop.
  sync-to-develop:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Open PR to bring hotfix release back into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base develop \
            --head master \
            --title "chore: merge master hotfix release back into develop" \
            --body "Automated merge-back of a hotfix release from master into develop. Please resolve any CHANGELOG.md/pubspec.yaml conflicts before merging." \
            || echo "PR may already exist, continuing"
