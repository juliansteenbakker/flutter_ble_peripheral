name: widget tests & code analysis

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    needs: format
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - name: 'Latest stable'
            use_version_file: false
          - name: 'From flutter-version-file'
            use_version_file: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter ${{ matrix.flutter.name }}
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter.use_version_file && 'any' || 'stable' }}
          flutter-version-file: ${{ matrix.flutter.use_version_file && 'pubspec.yaml' || '' }}

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze
