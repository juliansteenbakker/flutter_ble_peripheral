name: flutter_ble_peripheral_example
description: Demonstrates how to use the flutter_ble_peripheral plugin.
publish_to: 'none'

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_ble_peripheral:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

  fonts:
    # One variable file carries both roles: Archivo for UI text and, at a wider
    # wdth axis, the expanded face used for panel labels.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
