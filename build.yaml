targets:
  $default:
    sources:
      # The example targets a newer Dart than the package's floor, and its
      # Windows build links the package back in under example/, so neither
      # can be compiled at the package's language version.
      exclude:
        - "example/**"
    builders:
      source_gen:combining_builder:
        options:
          # The legacy-analysis CI row replaces analysis_options.yaml, so the
          # generated code has to carry this ignore itself. AdvertiseData is
          # deprecated but still serialized for backwards compatibility.
          ignore_for_file:
            - deprecated_member_use_from_same_package
